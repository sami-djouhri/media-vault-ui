name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check (compileall)
        run: python -m compileall -q .
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check --select E4,E7,E9,F .
